services:
  yunqi-pavilion:
    image: yunqi-pavilion:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
        NPM_REGISTRY: https://registry.npmmirror.com
    container_name: yunqi-pavilion
    restart: unless-stopped
    ports:
      - "23000:3000"
    mem_limit: 512m
    volumes:
      - ./data:/app/server/data #指定路径下新建data
      - ./music:/app/server/music #映射播放器路径
      - ./PC:/app/server/PC #映射背景路径
      - ./APP:/app/server/APP #映射移动端背景路径
      - ./doc:/app/server/doc #映射文件传输助手路径
      - /var/run/docker.sock:/var/run/docker.sock #映射Docker Socket
      - /vol1/1000/music-downloads:/downloads #音乐下载目录（LX 集成）
      - /vol1:/nas/vol1 #整盘挂载：下载目录可填 vol1 下任意路径
      - /vol2:/nas/vol2 #整盘挂载：下载目录可填 vol2 下任意路径
    depends_on:
      - music-engine

  music-engine:
    image: yunqi-music-engine:latest
    build:
      context: ./music-engine
      dockerfile: Dockerfile
    container_name: music-engine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - PORT=23400
      - NODE_USE_ENV_PROXY=0
      - PROXY_HOST=192.168.57.228
      - PROXY_PORT=7890
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - DEFAULT_SOURCES=ChangQing=https://raw.githubusercontent.com/pdone/lx-music-source/main/changqing/latest.js;Flower=https://raw.githubusercontent.com/pdone/lx-music-source/main/flower/latest.js;Grass=https://raw.githubusercontent.com/pdone/lx-music-source/main/grass/latest.js;HuanYin=https://raw.githubusercontent.com/pdone/lx-music-source/main/huanyin/latest.js;Huibq=https://raw.githubusercontent.com/pdone/lx-music-source/main/huibq/latest.js;ikun=https://raw.githubusercontent.com/pdone/lx-music-source/main/ikun/latest.js;JuheApi=https://raw.githubusercontent.com/pdone/lx-music-source/main/juhe/latest.js;LX=https://raw.githubusercontent.com/pdone/lx-music-source/main/lx/latest.js;QDY=https://raw.githubusercontent.com/pdone/lx-music-source/main/qdy/latest.js;SixYin=https://raw.githubusercontent.com/pdone/lx-music-source/main/sixyin/latest.js;XingHai=https://raw.githubusercontent.com/pdone/lx-music-source/main/xinghai/latest.js
    volumes:
      - ./music-engine-data/sources:/app/data/sources #音源脚本持久化
